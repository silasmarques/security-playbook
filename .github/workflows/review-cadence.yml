# Cadência de revisão: falha quando um módulo passa do prazo (stack: trimestral;
# core: anual). Separado do CI para o tempo não quebrar o push de ninguém — mas
# o aviso chega.
name: review-cadence
on:
  schedule:
    - cron: "0 9 * * 1" # segundas, 09:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - run: deno run --allow-read scripts/verify-docs.ts --strict-dates
