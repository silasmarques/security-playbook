# CI do playbook: a norma verificada como código.
# verify-docs: links relativos, frontmatter ↔ matriz OWASP, limites de tamanho.
# check-code-blocks: todo bloco de "Padrões prontos" compila (deno check).
name: ci
on: [push, pull_request]

permissions:
  contents: read # permissões mínimas (dependencies-supply-chain R7)

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Links, matriz OWASP e limites
        run: deno run --allow-read scripts/verify-docs.ts
      - name: Padrões prontos compilam
        run: deno run --allow-read --allow-write --allow-run --allow-net --allow-env scripts/check-code-blocks.ts
