# O próprio P4 de core/secrets-config.md, aplicado a este repo.
name: gitleaks
on: [pull_request, push, workflow_dispatch]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # histórico completo — secret antigo também é vazamento
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml # ignora os segredos FALSOS da cobaia (lab/)
